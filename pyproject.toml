[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykoopman"
version = "1.2.4"
authors = [
    { name = "Shaowu Pan", email = "shawnpan@uw.edu" },
    { name = "Eurika Kaiser", email = "eurika@uw.edu" },
    { name = "Brian de Silva", email = "bdesilva@uw.edu" },
    { name = "J. Nathan Kutz", email = "kutz@uw.edu" },
    { name = "Steven L. Brunton", email = "sbrunton@uw.edu" },
]
description = "Python package for data-driven approximations to the Koopman operator."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib >=3.6.0",
    "derivative ~= 0.6.0",
    "scikit-learn >= 1.1.3, <= 1.1.3",
    "numpy >= 1.20, <= 1.26",
    "scipy > 1.6.0, <= 1.11.2",
    # PyDMDRegressor reads private attributes of the pydmd object it wraps, so
    # raise this cap only after running the tests on the newer pydmd release
    # (test/test_package.py lists the releases that CI tests).
    "pydmd > 0.4, <= 2025.8.1",
    "optht ~= 0.2.0",
    "prettytable >3.0.0, <= 3.9.0",
    "torch>=2.1,<2.14",
    "lightning ~= 2.0.9",
    # setuptools 82 removed pkg_resources, which lightning < 2.4 imports at
    # import time and torch 2.1 imports in torch.utils.cpp_extension.
    "setuptools < 82",
]

# Tools for contributors and for the docs build. Keep them out of the runtime
# dependencies above, where they would pin the pytest, Sphinx and Jupyter of
# every environment that installs pykoopman (test/test_package.py checks this).
[project.optional-dependencies]
test = [
    "pytest >= 9.0.3",
    "pytest-cov >= 7.0",
    "pytest-lazy-fixtures >= 1.4",
]
docs = [
    "sphinx >= 3, <= 7.0.0",
    "nbsphinx",
    "sphinx-codeautolink",
    "sphinxcontrib-apidoc",
    "sphinx_rtd_theme",
    # nbsphinx uses these to highlight the IPython code cells of the tutorial
    # notebooks and to render their stored widget outputs (progress bars).
    "ipython",
    "ipywidgets",
]
dev = [
    "pykoopman[test,docs]",
    "jupyter >= 1.0.0",
    "notebook >= 7.5.6",
    "pre-commit",
]


[project.urls]
"Homepage" = "https://github.com/dynamicslab/pykoopman"
"Bug Tracker" = "https://github.com/dynamicslab/pykoopman/issues"

[tool.pytest.ini_options]
# pytest-lazy-fixture (without the "s"), left over in environments created for
# pykoopman 1.2.2 or earlier, breaks test collection on pytest 8 and newer.
addopts = "-p no:lazy-fixture"
